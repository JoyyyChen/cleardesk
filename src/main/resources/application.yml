# 本地默认配置，敏感信息请用环境变量覆盖，不要写入仓库
spring:
  application:
    name: cleardesk
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # MYSQL_SSL：本地/Docker 内网默认 false；连云数据库（RDS 等）时设成 true
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:cleardesk}?useUnicode=true&characterEncoding=utf8&useSSL=${MYSQL_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
  session:
    timeout: 1d
    data:
      redis:
        namespace: cleardesk:session
  jackson:
    time-zone: Asia/Shanghai
    datatype:
      datetime:
        write-dates-as-timestamps: false
server:
  port: 8080
  servlet:
    context-path: /api
    session:
      timeout: 1d
      cookie:
        http-only: true
        same-site: lax
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false # 列名与实体字段一致（如 userAccount），不做下划线转换
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
